name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: devops-flask-postgres
  IMAGE_TAG: 3.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir repositorio a minúsculas
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Construir Imagen
        run: |
          docker build \
          -t ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_TAG }} \
          -t ghcr.io/${{ env.REPO_LOWER }}:latest \
          .

      - name: Publicar Imagen
        run: |
          docker push ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_TAG }}
          docker push ghcr.io/${{ env.REPO_LOWER }}:latest